name: build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: ['main']

env:
  # Keep in sync with .nvmrc / .node-version and the packageManager field in package.json.
  # Jobs that restore the workspace from cache set up node/pnpm before any checkout,
  # so they cannot read those files.
  NODE_VERSION: 22.23.5
  PNPM_VERSION: 10.28.1
  # GitVersion 7 CLI telemetry opt-out
  DO_NOT_TRACK: '1'

jobs:
  changes:
    runs-on: [self-hosted]
    permissions:
      pull-requests: read
      contents: read
    outputs:
      needs_build: ${{ steps.filter.outputs.needs_build }}
    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - uses: actions/checkout@v7
        with:
          fetch-depth: 25
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            needs_build:
              - '.github/workflows/main.yml'
              - 'packages/**'
              - 'test/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
      - name: Log all filter results
        run: |
          echo "needs_build: ${{ steps.filter.outputs.needs_build }}"

  core-build:
    needs: changes
    if: ${{ needs.changes.outputs.needs_build == 'true' }}
    runs-on: [self-hosted]
    env:
      NODE_ENV: development

    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - uses: actions/checkout@v7
        with:
          fetch-depth: 25

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm install
      - run: pnpm run build

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

  tests:
    runs-on: [self-hosted]
    needs: core-build
    if: ${{ vars.ENABLE_TESTS == '1' }}
    strategy:
      # max-parallel: 1
      fail-fast: false
      matrix:
        database: [mongoose, postgres, postgres-custom-schema, postgres-uuid] #, supabase]
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payloadtests
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_ACCESS_KEY_ID: localstack
      AWS_SECRET_ACCESS_KEY: localstack
      AWS_REGION: us-east-1

    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - name: dpkg configure
        run: |
          apt update
          dpkg --configure -a

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: true

      - name: install PostgreSQL manually
        run: |
          apt install curl ca-certificates
          install -d /usr/share/postgresql-common/pgdg
          curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sh -c "echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          apt update
          apt -y install postgresql
          apt install -y postgresql-14
        if: startsWith(matrix.database, 'postgres')

      - name: stop and remove all docker containers
        run: |
          echo "Stopping all running containers..."
          docker stop $(docker ps -a -q) || true
          echo "Removing all running containers..."
          docker rm $(docker ps -a -q) || true
          echo "Done!"

      # - name: start MongoDB docker
      #   run: |
      #     docker run -it --rm -d --name mongodb -e MONGO_ROOTUSER=${MONGO_ROOTUSER:-admin} -e MONGO_ROOTPASSWORD=${MONGO_ROOTPASSWORD:-admin} mongo:8.0.13
      #   if: startsWith(matrix.database, 'mongoose')

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Restore build
        uses: actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Start LocalStack
        run: pnpm docker:start

      - name: Start PostgreSQL
        uses: CasperWA/postgresql-action@v1.2
        with:
          postgresql version: '14' # See https://hub.docker.com/_/postgres for available versions
          postgresql db: ${{ env.POSTGRES_DB }}
          postgresql user: ${{ env.POSTGRES_USER }}
          postgresql password: ${{ env.POSTGRES_PASSWORD }}
        if: startsWith(matrix.database, 'postgres')

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
        if: matrix.database == 'supabase'

      - name: Initialize Supabase
        run: |
          supabase init
          supabase start
        if: matrix.database == 'supabase'

      - name: Wait for MongoDB
        run: sleep 30
        if: matrix.database == 'mongoose'

      - name: Wait for PostgreSQL
        run: sleep 30
        if: startsWith(matrix.database, 'postgres')

      - name: Configure PostgreSQL
        run: |
          psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB" -c "CREATE ROLE runner SUPERUSER LOGIN;"
          psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB" -c "SELECT version();"
          echo "POSTGRES_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB" >> $GITHUB_ENV
        if: startsWith(matrix.database, 'postgres')

      - name: Configure PostgreSQL with custom schema
        run: |
          psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB" -c "CREATE SCHEMA custom;"
        if: matrix.database == 'postgres-custom-schema'

      - name: Configure Supabase
        run: |
          echo "POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> $GITHUB_ENV
        if: matrix.database == 'supabase'

      - name: Component Tests
        run: pnpm test:components
        continue-on-error: ${{ matrix.database == 'mongoose' }}

      - name: Integration Tests
        run: pnpm test:int
        env:
          NODE_OPTIONS: --max-old-space-size=8096
          PAYLOAD_DATABASE: ${{ matrix.database }}
          POSTGRES_URL: ${{ env.POSTGRES_URL }}

      # - name: stop MongoDB container
      #   run: |
      #     docker stop mongodb || true
      #   if: always() && matrix.database == 'mongoose'

  tests-e2e:
    runs-on: [self-hosted]
    needs: core-build
    if: ${{ vars.ENABLE_TESTS == '1' }}
    strategy:
      fail-fast: false
      matrix:
        # find test -type f -name 'e2e.spec.ts' | sort | xargs dirname | xargs -I {} basename {}
        suite:
          - _community
          - access-control
          - admin
          - auth
          - field-error-states
          - fields-relationship
          # - fields
          # - live-preview
          - localization
          # - plugin-nested-docs #TODO: temporarily disabled tests
          # - plugin-seo #TODO: temporarily disabled tests
          - refresh-permissions
          # - uploads
          - versions
        # part: [1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8, 8/8]

    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - name: dpkg configure
        run: |
          apt update
          dpkg --configure -a

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Restore build
        uses: actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Store Playwright's Version
        run: |
          # Extract the version number using a more targeted regex pattern with awk
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --depth=0 | awk '/@playwright\/test/ {print $2}')
          echo "Playwright's Version: $PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Setup Playwright - Browsers and Dependencies
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Playwright - Dependencies-only
        if: steps.cache-playwright-browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E Tests
        uses: nick-fields/retry@v4
        with:
          retry_on: error
          max_attempts: 2
          timeout_minutes: 15
          command: pnpm test:e2e ${{ matrix.suite }} --bail
        continue-on-error: ${{ matrix.suite == 'admin' }}

  tests-type-generation:
    runs-on: [self-hosted]
    needs: core-build
    if: ${{ vars.ENABLE_TESTS == '1' }}

    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Restore build
        uses: actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Generate Payload Types
        run: pnpm dev:generate-types fields

      - name: Generate GraphQL schema file
        run: pnpm dev:generate-graphql-schema graphql-schema-gen

  build-packages:
    runs-on: [self-hosted]
    needs: core-build
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - db-mongodb
          - db-postgres
          - bundler-webpack
          - bundler-vite
          - richtext-slate
          - richtext-lexical
          - live-preview
          - live-preview-react

    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Restore build
        uses: actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Build ${{ matrix.pkg }}
        run: pnpm turbo run build --filter=./packages/${{ matrix.pkg }}

  plugins:
    runs-on: [self-hosted]
    needs: core-build
    if: ${{ false }} #TODO: understand plugins creation for the future
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - create-mzinga-app
          - plugin-cloud
          - plugin-cloud-storage
          - plugin-form-builder
          - plugin-nested-docs
          - plugin-search
          - plugin-sentry
          - plugin-seo

    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Restore build
        uses: actions/cache@v6
        with:
          path: ./*
          key: ${{ github.sha }}-${{ github.run_number }}

      - name: Build ${{ matrix.pkg }}
        run: pnpm turbo run build --filter=./packages/${{ matrix.pkg }}

      - name: Test ${{ matrix.pkg }}
        run: pnpm --filter ${{ matrix.pkg }} run test
        if: matrix.pkg != 'create-mzinga-app' # degit doesn't work within GitHub Actions

  upload-test-results:
    needs: tests-e2e
    runs-on: [self-hosted]
    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 1

  # Releases are tag-only: the version is computed with GitVersion 7 and applied to the
  # packages at publish time (publish.yml runs `pnpm version:all <tag>` in CI), so nothing
  # is committed back to the protected main branch (the ruleset blocks direct pushes).
  release-new-version:
    permissions:
      contents: write
    needs: [build-packages]
    runs-on: [self-hosted]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.head_ref, 'rc-')) }}
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version_step.outputs.fullSemVer }}
      created: ${{ steps.tag.outputs.created }}
      prerelease: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v5.0.0
        with:
          versionSpec: '7.0.x'

      - name: Determine Version
        id: version_step # step id used as a reference for output values
        uses: gittools/actions/gitversion/execute@v5.0.0

      - name: Create and push release tag
        id: tag
        env:
          VERSION: ${{ steps.version_step.outputs.fullSemVer }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::GitVersion did not return a version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::warning::Tag $VERSION already exists, skipping release creation"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "mzingabot"
          git config user.email "mzingabot@mzinga.io"
          git tag -a "$VERSION" -m "Release $VERSION" HEAD
          git push origin "refs/tags/$VERSION"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version_step.outputs.fullSemVer }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'pull_request' }}

  # Releases created with GITHUB_TOKEN do not trigger other workflows (`on: release`),
  # so publishing and the post-release comments are invoked explicitly.
  publish:
    needs: [release-new-version]
    if: ${{ needs.release-new-version.outputs.created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-new-version.outputs.version }}
      npm_tag: ${{ needs.release-new-version.outputs.prerelease == 'true' && 'rc' || 'latest' }}
    secrets: inherit

  post-release:
    needs: [release-new-version, publish]
    if: ${{ needs.release-new-version.outputs.created == 'true' && needs.release-new-version.outputs.prerelease != 'true' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/post-release.yml
    secrets: inherit
